<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imie Nazwisko (00000) - AI LAB D</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" type="text/css">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script src="scripts.js" defer></script>
</head>
<body>
<main class="container py-4">
    <h1 class="mb-4">Pogoda</h1>

    <form id="search-form" class="row g-2 mb-4">
        <div class="col">
            <label for="city" class="visually-hidden">Miasto</label>
            <input id="city" class="form-control" type="text" value="Kraków" placeholder="Miasto" required>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div id="loading" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Ładowanie...</span>
        </div>
    </div>

    <div id="alert" class="alert alert-danger d-none" role="alert"></div>

    <section id="today" class="mb-5"></section>
    <section id="forecast"></section>
</main>

<div id="day-modal" class="modal fade" tabindex="-1" aria-labelledby="day-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="day-modal-title" class="modal-title h5 text-capitalize"></h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
            </div>
            <div id="day-modal-body" class="modal-body"></div>
        </div>
    </div>
</div>
</body>
</html>
